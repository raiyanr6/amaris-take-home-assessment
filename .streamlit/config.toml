# Neutral, brand-free theme. Secrets never go here (see .gitignore: secrets.toml).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
font = "sans serif"

[server]
# MB. The app also checks the size itself to explain the limit in plain words.
maxUploadSize = 5

[browser]
gatherUsageStats = false
